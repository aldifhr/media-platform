# media-backend.aldifhr.my.id — nginx vhost (applied on the VPS)
#
# The VPS proxy is nginx (Caddy is installed but NOT running). This vhost was
# added for the media-platform API domain. It currently fronts the running
# manhwa backend on :3000 (the existing manhwa-scanner). A platform cutover
# (stop old scanner -> run platform-api -> repoint here) is a later step.
#
# Cert: Let's Encrypt via `certbot certonly --webroot -w /var/www/html
#       -d media-backend.aldifhr.my.id` (auto-renews).

server {
    listen 80;
    server_name media-backend.aldifhr.my.id;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name media-backend.aldifhr.my.id;
    ssl_certificate /etc/letsencrypt/live/media-backend.aldifhr.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media-backend.aldifhr.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # platform-admin API (bot-config). Trailing slash strips the /admin/ prefix.
    location /admin/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
