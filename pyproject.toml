[project]
name = "media-platform"
version = "0.1.0"
description = "Unified media platform: manhwa tracker + pahe release notifier (modular monolith)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "discord-interactions>=0.1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "curl-cffi>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "orjson>=3.10",
    "prometheus_client>=0.20",
    "pillow>=10.0",
    "requests>=2.31",
]

# uv workspace members are wired per-phase as each package gains its own
# pyproject.toml (Phase 2+: core/*, modules/*, apps/*). See docs/audit/migration-plan.md
# [tool.uv.workspace]
# members = ["apps/*", "modules/*", "core/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored manhwa backend (faithful copy from manhwa-scanner) keeps its own lint
# state; platform-strict ruff applies to authored code (core/, apps/, modules/media,
# tests/). Re-include manhwa subdirs as they are refactored onto core/.
extend-exclude = ["modules/manhwa", "modules/media", "tests/test_media_pahe_regressions.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
