[project]
name = "media-platform"
version = "0.1.0"
description = "Unified media platform: manhwa tracker + pahe release notifier (modular monolith)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# uv workspace members are wired per-phase as each package gains its own
# pyproject.toml (Phase 2+: core/*, modules/*, apps/*). See docs/audit/migration-plan.md
# [tool.uv.workspace]
# members = ["apps/*", "modules/*", "core/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
